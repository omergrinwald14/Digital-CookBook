<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saving recipe… — CookBook</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main style="max-width: 480px; margin: 4rem auto; padding: 1.5rem; text-align: center;">
    <h1>Digital CookBook</h1>
    <p id="status">Reading shared link…</p>
    <p><a href="/">← Back to recipes</a></p>
  </main>

  <script src="share-queue.js"></script>
  <script>
    const API_BASE = "https://digital-cookbook-api.onrender.com"; // live backend (matches app.js)
    const statusEl = document.getElementById("status");

    // Who is sharing — same localStorage identity app.js writes at login.
    // Null if this phone never logged in; the backend then falls back to
    // its default owner (migration behavior).
    const OWNER = localStorage.getItem("cookbook-user");

    // Shared data arrives as query params (manifest share_target, GET method).
    const params = new URLSearchParams(window.location.search);
    const text = params.get("text") || "";
    const urlParam = params.get("url") || "";

    // Instagram puts the link in `url` sometimes, but usually inside `text`.
    function extractUrl() {
      if (/^https?:\/\//i.test(urlParam)) return urlParam.trim();
      const match = text.match(/https?:\/\/\S+/i);
      return match ? match[0] : "";
    }

    // Fire-and-forget: queue the URL + register a one-off Background Sync,
    // then confirm instantly. The service worker POSTs (and retries) later —
    // the user never waits out Render's cold start. Chromium/Android only.
    async function queueShare(url) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (!reg || !("sync" in reg)) return false;   // no SW / no Background Sync
      await enqueueShare(url, OWNER);  // owner rides with the queued job
      await reg.sync.register("share-import");
      return true;
    }

    // Fallback (e.g. iOS Safari): the old synchronous POST — user waits.
    async function importNow(url) {
      statusEl.textContent = "Saving recipe… this can take a minute.";
      const res = await fetch(`${API_BASE}/import`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...(OWNER ? { "X-User": OWNER } : {}),
        },
        body: JSON.stringify({ url }),
      });
      if (!res.ok) throw new Error(`Import failed (${res.status})`);
    }

    async function run() {
      const url = extractUrl();
      if (!url) {
        statusEl.textContent = "No link found in the shared content.";
        return;
      }
      try {
        if (!(await queueShare(url))) await importNow(url);
        statusEl.textContent = "Saved! Opening your cookbook…";
      } catch (err) {
        // The direct POST failed — offline, or a cold/unreachable server. On
        // Android the Background Sync path above already queued it, but on
        // iOS (no Background Sync) this used to be where the share simply
        // VANISHED: the user saw an error and the link was gone for good.
        // Park it in IndexedDB instead. app.js drains that queue on every
        // app open, so the share survives to the next visit either way.
        try {
          await enqueueShare(url, OWNER);
          statusEl.textContent = "Saved to your queue — finishing it now…";
        } catch {
          // IndexedDB unavailable too (private browsing). Nothing left to try,
          // so stay on this page: the link is still in the address bar and the
          // user can retry rather than being bounced away empty-handed.
          statusEl.textContent = `Could not save: ${err.message}`;
          return;
        }
      }
      // window.close() here is unreliable on installed PWAs: some phones kill
      // the page but not the window, stranding a dead white screen. Navigating
      // to the app is predictable everywhere; the queue banner confirms the share.
      setTimeout(() => { window.location.replace("/"); }, 1200);
    }

    run();
  </script>
</body>
</html>
